name: Testbuild

# Portable Windows test build (zip, no installer, no release) of a branch that
# is not on main yet: start it by hand under Actions -> Testbuild -> "Run
# workflow" and pick the branch, or push to the Super-Update collecting branch.
# Download the zip from the run's "Artifacts", unpack, start
# fmplayeranalyzer.exe. It does not touch the installed version, but it uses
# the same data folder (%LOCALAPPDATA%\FM24PlayerAnalyzer) — back that up first.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-2i3rhj]

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage app with windeployqt
        shell: pwsh
        run: |
          $staging = "portable/FMPlayerAnalyzer-Testbuild"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item build/src/app/fmplayeranalyzer.exe $staging
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations `
            --no-system-d3d-compiler --no-opengl-sw "$staging/fmplayeranalyzer.exe"
          $sha = "${{ github.sha }}".Substring(0, 7)
          Set-Content "$staging/TESTBUILD.txt" "Testbuild $env:GITHUB_REF_NAME @ $sha - kein offizielles Release."

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: FMPlayerAnalyzer-Testbuild-Windows-portable
          path: portable/
          retention-days: 30
