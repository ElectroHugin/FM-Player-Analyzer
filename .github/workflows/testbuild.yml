name: Testbuild

# Release candidate of a branch that is not on main yet, built exactly like the
# Release workflow (same windeployqt + Inno Setup installer, version from
# Version.cpp), plus a portable zip that leaves the installed version alone.
# Both use the data folder %LOCALAPPDATA%\FM24PlayerAnalyzer — back that up first.
# Every push to a release/X.Y.Z branch replaces the GitHub pre-release
# "testbuild-X.Y.Z" (never marked as latest, separate from the vX.Y.Z tags the
# Release workflow checks). Other branches (manual run) get run artifacts only.
on:
  workflow_dispatch:
  push:
    branches: ['release/**']

permissions:
  contents: write

concurrency:
  group: testbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja from PyPI: the setup action's download from GitHub releases
      # arrived broken (Nov 2026). The Python of the Qt setup is on PATH.
      - name: Setup Ninja
        run: |
          python -m pip install --disable-pip-version-check ninja
          ninja --version

      - name: Configure
        run: cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage app with windeployqt
        shell: pwsh
        run: |
          $staging = "portable/FMPlayerAnalyzer-Testbuild"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item build/src/app/fmplayeranalyzer.exe $staging
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations `
            --no-system-d3d-compiler --no-opengl-sw "$staging/fmplayeranalyzer.exe"
          $sha = "${{ github.sha }}".Substring(0, 7)
          Set-Content "$staging/TESTBUILD.txt" "Testbuild $env:GITHUB_REF_NAME @ $sha - kein offizielles Release."

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $src = Get-Content desktop/src/core/Version.cpp -Raw
          if ($src -notmatch 'appVersion[\s\S]*?QStringLiteral\("(\d+\.\d+\.\d+)"\)') {
            throw "Version aus Version.cpp konnte nicht gelesen werden."
          }
          "version=$($matches[1])" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup, as in the release)
        shell: pwsh
        run: |
          $staging = "desktop/installer/staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          Copy-Item -Recurse "portable/FMPlayerAnalyzer-Testbuild" $staging
          Remove-Item "$staging/TESTBUILD.txt"
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "desktop\installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FMPlayerAnalyzer-${{ steps.version.outputs.version }}-Windows-x64-Setup
          path: desktop/installer/output/*.exe
          retention-days: 30

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: FMPlayerAnalyzer-Testbuild-Windows-portable
          path: portable/
          retention-days: 30

      - name: Publish testbuild pre-release
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "testbuild-$version"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $zip = "FMPlayerAnalyzer-$version-Testbuild-Windows-portable.zip"
          Compress-Archive -Path "portable/FMPlayerAnalyzer-Testbuild" -DestinationPath $zip -Force
          $setup = "desktop/installer/output/FMPlayerAnalyzer-$version-Windows-x64-Setup.exe"
          # Replace the previous testbuild (same tag, so the page address stays).
          $PSNativeCommandUseErrorActionPreference = $false
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag *> $null
          $notes = "Testbuild of $version (branch $env:GITHUB_REF_NAME, commit $sha). Not an official release, replaced on every change. Back up %LOCALAPPDATA%\FM24PlayerAnalyzer before installing."
          gh release create $tag $setup $zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease --latest=false `
            --title "Testbuild $version" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Testbuild-Release fehlgeschlagen." }
          exit 0
