name: CI

# Build + tests for pull requests and pushes to any branch except main
# (main is covered by the Release workflow, which also builds and tests).
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja from PyPI: the setup action's download from GitHub releases
      # arrived broken (Nov 2026). The Python of the Qt setup is on PATH.
      - name: Setup Ninja
        run: |
          python -m pip install --disable-pip-version-check ninja
          ninja --version

      - name: Configure
        run: cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Build + tests on Linux, plus the AppImage as a workflow artifact.
  linux:
    uses: ./.github/workflows/linux.yml
