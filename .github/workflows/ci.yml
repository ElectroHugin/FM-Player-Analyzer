name: CI

# Build + tests for pull requests and pushes to any branch except main
# (main is covered by the Release workflow, which also builds and tests).
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # No display on the runner: every Qt test runs on the offscreen platform.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # Also installs the system libraries Qt needs (OpenGL, xkbcommon, xcb).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake --preset linux-release

      # -k 0: keep going, so one run reports every compile error.
      - name: Build
        run: cmake --build --preset linux-release -- -k 0

      - name: Test
        run: ctest --preset linux-release
